name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Verify synthetic fixtures and report reproducibility
        run: |
          python tools/generate_demo.py
          python -m sentinel_logwatch analyze examples/modern-auth.jsonl --strict --html docs/demo-report.html --json docs/demo-report.json
          git diff --exit-code -- examples docs/demo-report.html docs/demo-report.json
      - name: Build and install CLI
        run: python -m pip install .
      - name: Check installed entry point outside the checkout
        working-directory: ${{ runner.temp }}
        run: sentinel-logwatch --version
