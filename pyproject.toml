[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logwatch"
version = "1.0.0"
description = "Offline authentication-log triage with explainable detections and evidence reports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hammad Chughtai"}]
keywords = ["cybersecurity", "blue-team", "log-analysis", "ssh", "detection-engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
logwatch = "logwatch.cli:main"

[project.urls]
Repository = "https://github.com/Hammad-Chughtai/LogWatch"
Issues = "https://github.com/Hammad-Chughtai/LogWatch/issues"

[tool.setuptools.packages.find]
include = ["logwatch*"]
